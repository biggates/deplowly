[project]
name = "deplowly"
version = "0.1.0"
description = "In-cluster Kubernetes Deployment image-watchdog that auto rollout-restarts on registry digest change."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kubernetes>=30.1.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
]

[project.scripts]
deplowly = "deplowly.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deplowly"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
