apiVersion: v1
kind: ConfigMap
metadata:
  name: deplowly-config
  namespace: deplowly
data:
  config.yaml: |
    default_interval: 60
    targets:
      # 按实际集群替换为需要监控的 Deployment
      - namespace: prod
        deployment: web-api
      - namespace: prod
        deployment: worker
        interval: 300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deplowly
  namespace: deplowly
  labels:
    app: deplowly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deplowly
  template:
    metadata:
      labels:
        app: deplowly
    spec:
      serviceAccountName: deplowly
      containers:
        - name: deplowly
          image: ghcr.io/your-org/deplowly:latest
          args: ["/etc/deplowly/config.yaml"]
          env:
            - name: LOG_LEVEL
              value: "INFO"
          volumeMounts:
            - name: config
              mountPath: /etc/deplowly
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: deplowly-config
